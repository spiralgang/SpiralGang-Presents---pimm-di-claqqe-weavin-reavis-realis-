<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes subtle-gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes flux-gradient {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }

        @keyframes flux-glow {
            0%, 100% { box-shadow: 0 0 5px rgba(168, 85, 247, 0.3), 0 0 10px rgba(168, 85, 247, 0.2); }
            50% { box-shadow: 0 0 15px rgba(168, 85, 247, 0.5), 0 0 25px rgba(168, 85, 247, 0.4); }
        }

        body {
            background-color: #111827; /* bg-gray-900 */
        }

        .flux-background {
            background: linear-gradient(135deg, 
                hsl(260, 50%, 10%), 
                hsl(280, 45%, 15%), 
                hsl(260, 50%, 10%));
            background-size: 200% 200%;
            animation: subtle-gradient 25s ease infinite;
        }
        
        .flux-active .flux-background {
            background: radial-gradient(circle at 100% 100%, 
                hsl(var(--dynamic-hue-1, 260), 60%, 20%), 
                hsl(var(--dynamic-hue-2, 320), 50%, 15%), 
                #111827 70%);
            background-size: 200% 200%;
            animation: flux-gradient 15s ease infinite;
        }

        .flux-container-transform {
            transition: transform 0.7s cubic-bezier(0.25, 1, 0.5, 1);
            transform-style: preserve-3d;
        }

        .flux-active .flux-container-transform {
            transform: perspective(2000px) rotateY(-2deg) rotateX(3deg) scale(0.98);
        }

        .flux-active button:not(:disabled), .flux-active input:focus {
             animation: flux-glow 2s ease-in-out infinite;
        }

        .prose {
            color: #d1d5db; /* prose-invert */
        }
        .prose h1, .prose h2, .prose h3, .prose h4, .prose strong {
            color: #f9fafb;
        }
        .prose a {
            color: #a78bfa;
        }
        .prose code {
           color: #f3f4f6;
           background-color: rgba(255, 255, 255, 0.1);
           padding: 0.2em 0.4em;
           margin: 0;
           font-size: 85%;
           border-radius: 6px;
        }
        .prose pre {
            background-color: #1f2937;
            border: 1px solid #374151;
            padding: 1em;
            border-radius: 8px;
            overflow-x: auto;
        }
        .prose pre code {
            background-color: transparent;
            padding: 0;
            margin: 0;
            font-size: inherit;
            border-radius: 0;
        }
